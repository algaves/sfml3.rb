AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  # Build output, not source: pkg/ and tmp/ hold copies of lib/ and ext/
  # staged for packaging, so linting them double-counts every offence in the
  # real files.
  #
  # Setting `Exclude` replaces RuboCop's defaults, so the vendored bundles must
  # be named explicitly: on CI `bundle install` puts them in `vendor/bundle`,
  # inside the tree RuboCop walks, and the `rbs` gem there ships a
  # `.rubocop.yml` requiring its own plugins, which then fail to load.
  Exclude:
    - 'pkg/**/*'
    - 'tmp/**/*'
    - 'ports/**/*'
    - 'vendor/**/*'

# mkmf drives the build through these globals ($INCFLAGS, $LDFLAGS, $libs);
# an extconf.rb cannot set compiler flags without them.
Style/GlobalVars:
  Exclude:
    - 'ext/extconf.rb'

# Examples are runnable scripts, not library code: a top-level `include SFML`
# and the window -> poll -> case -> branch render loop are both the point, so
# the mixin and block-nesting cops do not apply.
Style/MixinUsage:
  Exclude:
    - 'examples/**/*'

Metrics/BlockNesting:
  Exclude:
    - 'examples/**/*'

# Test methods legitimately run long: a round-trip check is a linear sequence of
# assertions, and splitting one into helpers to satisfy a line count makes the
# failure harder to read, not the test better. The single test class is the
# minitest convention.
#
# ext/extconf.rb is mkmf glue and ext/ports.rb is the vendored-dependency
# recipe; both are long by nature and none of it is runtime API.
Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'ext/extconf.rb'
    - 'ext/ports.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'ext/extconf.rb'
    - 'ext/ports.rb'

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'ext/ports.rb'
