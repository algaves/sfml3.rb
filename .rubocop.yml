# Merge `Exclude` lists with RuboCop's defaults instead of replacing them.
# Without this, naming `examples/**/*` as an exclusion for a cop (say
# Metrics/BlockLength) would silently drop that cop's built-in defaults
# (`**/*.gemspec`, `Rakefile`, ...) and start flagging files the stock config
# ignores.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  # Build output, not source: pkg/ and tmp/ hold copies of lib/ and ext/
  # staged for packaging, so linting them double-counts every offence in the
  # real files.
  #
  # Setting `Exclude` replaces RuboCop's defaults, so the vendored bundles must
  # be named explicitly: on CI `bundle install` puts them in `vendor/bundle`,
  # inside the tree RuboCop walks, and the `rbs` gem there ships a
  # `.rubocop.yml` requiring its own plugins, which then fail to load.
  Exclude:
    - 'pkg/**/*'
    - 'tmp/**/*'
    - 'ports/**/*'
    - 'vendor/**/*'

# mkmf drives the build through these globals ($INCFLAGS, $LDFLAGS, $libs);
# an extconf.rb cannot set compiler flags without them.
Style/GlobalVars:
  Exclude:
    - 'ext/extconf.rb'

# Examples are runnable scripts, not library code: a top-level `include SFML`,
# the window -> poll -> case -> branch render loop, and single-file games whose
# update/draw methods are honestly long are all the point. Holding them to the
# library's metric and documentation cops would only contort them.
Style/MixinUsage:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

Style/Documentation:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

Naming/MethodParameterName:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

Naming/PredicateMethod:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

Metrics/ParameterLists:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

Metrics/BlockNesting:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

Metrics/BlockLength:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/sfml/rubyesque.rb'
    - 'examples/**/*'
    - 'script/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'examples/**/*'
    - 'script/**/*'

# Test methods legitimately run long: a round-trip check is a linear sequence of
# assertions, and splitting one into helpers to satisfy a line count makes the
# failure harder to read, not the test better. The single test class is the
# minitest convention.
#
# ext/extconf.rb is mkmf glue and ext/ports.rb is the vendored-dependency
# recipe; both are long by nature and none of it is runtime API.
Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'ext/extconf.rb'
    - 'ext/ports.rb'
    - 'lib/sfml/rubyesque.rb'
    - 'examples/**/*'
    - 'script/**/*'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'ext/extconf.rb'
    - 'ext/ports.rb'
    - 'lib/sfml/rubyesque.rb'
    - 'examples/**/*'
    - 'script/**/*'

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'examples/**/*'
    - 'script/**/*'

# lib/sfml/rubyesque.rb reopens every class it extends and so reads as one long
# module; the same reason ext/ports.rb is exempt.
Metrics/ModuleLength:
  Exclude:
    - 'ext/ports.rb'
    - 'lib/sfml/rubyesque.rb'
    - 'examples/**/*'
    - 'script/**/*'

# The Rubyesque (Matz-like) layer deliberately keeps the pre-existing spellings
# alive as deprecated aliases, which trip the is_/has_ predicate-prefix rule.
Naming/PredicatePrefix:
  AllowedMethods:
    - is_a?
    - is_open?
    - has_axis?
    - has_text?
