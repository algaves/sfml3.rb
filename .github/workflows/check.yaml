name: Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          gems: |
            bundler
            rubocop

      - name: Install gems
        run: bundle install --jobs 4

      - name: Run RuboCop
        run: bundle exec rubocop