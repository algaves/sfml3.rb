name: Test (reusable)

on:
  workflow_call:
    inputs:
      ruby-version:
        description: 'Ruby version to install (passed through to ruby/setup-ruby)'
        type: string
        required: true
      runner:
        description: 'Runner label to execute the job on'
        type: string
        required: false
        default: ubuntu-latest
      job-name:
        description: 'Display name for the job in the Actions UI'
        type: string
        required: false
        default: Test

jobs:
  test:
    name: ${{ inputs.job-name }}
    runs-on: ${{ inputs.runner }}
    # rubocop and rake-compiler-dock are host-only and rubocop's floor tracks
    # the newest Ruby it supports, so leaving the group out is what lets the
    # oldest matrix entry resolve at all.
    env:
      BUNDLE_WITHOUT: development
      # Turns a warning back into a build failure, so the extension cannot drift
      # back onto deprecated APIs (notably the untyped Data_Wrap_Struct family)
      # without CI noticing.
      SFML_STRICT: 1
    steps:
      - uses: actions/checkout@v4

      # Only the X11/udev/GL stack comes from the system. FreeType, SFML and
      # CSFML are built from pinned, checksummed source by `rake ports`, so no
      # libcsfml package is involved -- the distro one is still CSFML 2.x and
      # would not work anyway.
      # Xvfb gives the suite the X11 display SFML needs; a few bindings
      # (Keyboard.delocalize, any window or texture construction) abort the
      # process rather than raise when DISPLAY is unset.
      - name: Install SFML build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake xvfb \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      # Building SFML from source dominates the run time and the sources are
      # pinned by checksum, so the recipe is most of the cache key. Deliberately
      # no Ruby version in it: Ports.prefix is keyed by RbConfig's host triple,
      # which is identical across Rubies on the same runner, so one prefix
      # serves them all. runner.arch disambiguates the x86_64 and arm64 callers
      # that both share this reusable workflow.
      - uses: actions/cache@v4
        with:
          path: ports
          key: ports-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ext/ports.rb') }}

      - name: Run tests
        run: xvfb-run -a bundle exec rake test
