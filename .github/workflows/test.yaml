name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake build-essential libfreetype-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          gems: |
            bundler
            rake
            minitest
            rubocop
            rice

      - name: Install gems
        run: bundle install --jobs 4

      - name: Run tests
        run: bundle exec rake test