name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Exactly the ABI set the binary gems ship, so every Ruby that can
        # receive a precompiled gem is also proven to build from source.
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    uses: ./.github/workflows/_test-reusable.yaml
    with:
      ruby-version: ${{ matrix.ruby }}
      job-name: Ruby ${{ matrix.ruby }}
